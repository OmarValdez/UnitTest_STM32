name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install Ceedling dependencies
        run: |
          gem install ceedling
          bundle install

      - name: Verify Ceedling installation
        run: |
          ceedling version
          gem list

      - name: Run Unit Tests
        run: |
          cd tests
          bundle exec ceedling test:all

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: 'tests/build/test/results/*.xml'
          check_name: 'Unit Tests'
          fail_on_failure: true