# ============================================================
# Proyect - CI Configuration (Host compilation)
# ============================================================
:project:
  :name: "ST_UnitTest_CI"
  :use_mocks: TRUE
  :use_test_preprocessor: :none
  :use_backtrace: :simple
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all
  :test_threads: 4
  :compile_threads: 4
  :release_build: FALSE

:paths:
  :test:
    - +:test/**
  :source:
    - ../Core/Src/**
  :include:
    - ../Core/Inc/**

:files:
  :test: []
  :source: []

:defines:
  :test:
    - UNITY_INCLUDE_DOUBLE
  :release: []

:cmock:
  :enabled: true
  :mock_prefix: 'mock_'
  :mock_suffix: ''
  :verbosity: 2
  :when_no_prototypes: :warn
  :plugins:
    - :expect
    - :expect_any_args
    - :return
    - :callback
    - :ignore
    - :ignore_arg
    - :array
    - :cexception
  :enforce_strict_ordering: true
  :fail_on_unexpected_calls: true
  :include:
    - led_logic.h

:test_runner:
  :enabled: true

:tools:
  :test_compiler:
    :executable: gcc
    :arguments:
      - -I"../Core/Inc"
      - -I"build/vendor/unity/src"
      - -I"build/vendor/cmock/src"
      - -I"build/test/mocks"
      - -DUNITY_INCLUDE_DOUBLE
      - -c "${1}"
      - -o "${2}"
  :test_linker:
    :executable: gcc
    :arguments:
      - "${1}"
      - -o "${2}"
      - -lm