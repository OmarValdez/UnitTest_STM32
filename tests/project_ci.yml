# ============================================================
# Proyect - CI Configuration (Host compilation)
# ============================================================
:project:
  :name: "ST_UnitTest_CI"
  :use_test_preprocessor: :none
  :use_backtrace: :simple
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all
  :test_threads: 4
  :compile_threads: 4
  :release_build: FALSE

:paths:
  :test:
    - +:test/**
  :source:
    - ../Core/Src/**
  :include:
    - ../Core/Inc/**
  :support:
    - test/support

:files:
  :test: []
  :source: []

:defines:
  :test:
    - UNITY_INCLUDE_DOUBLE
  :release: []

# CMock disabled: mocks are provided manually in test/support/
:cmock:
  :enabled: false

:plugins:
  :enabled:
    - report_tests_log_factory

:report_tests_log_factory:
  :reports:
    - junit

:test_runner:
  :enabled: true

:tools:
  :test_compiler:
    :executable: gcc
    :arguments:
      - -I"../Core/Inc"
      - -I"test/support"
      - -I"build/vendor/unity/src"
      - -DUNITY_INCLUDE_DOUBLE
      - -c "${1}"
      - -o "${2}"
  :test_linker:
    :executable: gcc
    :arguments:
      - "${1}"
      - -o "${2}"
      - -lm
