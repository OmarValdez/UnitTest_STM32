# ============================================================
# Proyect - CI Configuration (Host compilation)
# ============================================================
:project:
  :build_root: build
  :release_build: FALSE
  :test_file_prefix: test_

# ============================================================
# RESULTADOS DE PRUEBAS
# ============================================================
:test_results:
  :enabled: true
  :include_failure_messages: true

# ============================================================
# RUTAS
# ============================================================
:paths:
  :test:
    - +:test/
  :source:
    - ../Core/Src/
  :include:
    - ../Core/Inc/

:files:
  :source:
    - ../Core/Src/*.c
    - build/test/mocks/**/*.c
  :test:
    - test/test_*.c

:defines:
  :test:
    - UNITY_INCLUDE_DOUBLE

# === CMOCK HABILITADO ===
:cmock:
  :enabled: true
  :mock_prefix: mock_
  :mock_path: test/mocks
  :include:
    - led_logic.h
  :plugins:
    - :expect
    - :expect_any_args
    - :return
    - :callback
    - :ignore
    - :ignore_arg
    - :array
    - :cexception

# === HABILITAR GENERACIÓN AUTOMÁTICA DE RUNNERS ===
:test_runner:
  :enabled: true


# ============================================================
# HERRAMIENTAS - Host GCC for CI
# ============================================================
:tools:
  :test_compiler:
    :executable: gcc
    :arguments:
      - -I"../Core/Inc"
      - -I"build/vendor/unity/src"
      - -I"build/vendor/cmock/src"
      - -I"build/test/mocks"
      - -DUNITY_INCLUDE_DOUBLE
      - -c "${1}"
      - -o "${2}"
  :test_linker:
    :executable: gcc
    :arguments:
      - "${1}"
      - -o "${2}"
      - -lm