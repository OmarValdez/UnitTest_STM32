# ============================================================
# Proyect
# ============================================================
:project:
  :build_root: build
  :release_build: FALSE
  :test_file_prefix: test_

# ============================================================
# RESULTADOS DE PRUEBAS
# ============================================================
:test_results:
  :enabled: true
  :include_failure_messages: true

# ============================================================
# RUTAS
# ============================================================
:paths:
  :test:
    - +:test/
  :source:
    - ../Core/Src/
  :include:
    - ../Core/Inc/
    - test/support/
  :support:
    - test/support/

:files:
  :source:
    - ../Core/Src/*.c
  :test:
    - test/test_*.c
  :support:
    - test/support/*.c

:defines:
  :test:
    - UNITY_INCLUDE_DOUBLE

# === CMOCK DESHABILITADO ===
:cmock:
  :enabled: false

# === HABILITAR GENERACIÓN AUTOMÁTICA DE RUNNERS ===
:test_runner:
  :enabled: true

# ============================================================
# CONFIGURACIÓN DE COBERTURA (GCOV)
# ============================================================
:coverage:
  :enabled: true
  :reports:
    - GcovHtml   # Genera reporte HTML
    - GcovJson   # Genera reporte JSON (para integrar con Jenkins)
  :tools:
    :gcov:
      :executable: gcov
      :arguments: []
  :source_files:
    - ../Core/Src/*.c
    - ../Core/Inc/*.h

# ============================================================
# HERRAMIENTAS
# ============================================================
:tools:
  :test_compiler:
    :executable: gcc
    :arguments:
      - -I"../Core/Inc"
      - -I"test/support/"
      - -I"D:/Ruby40-x64/lib/ruby/gems/4.0.0/gems/ceedling-1.1.2/vendor/unity/src"
      - -DUNITY_INCLUDE_DOUBLE
      - -fprofile-arcs
      - -ftest-coverage
      - -c "${1}"
      - -o "${2}"
  :test_linker:
    :executable: gcc
    :arguments:
      - "${1}"
      - -o "${2}"
      - -lm
      - -lgcov