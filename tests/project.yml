# ============================================================
# Proyect
# ============================================================
:project:
  :build_root: build
  :release_build: FALSE
  :test_file_prefix: test_

# ============================================================
# RESULTADOS DE PRUEBAS
# ============================================================
:test_results:
  :enabled: true
  :include_failure_messages: true

# ============================================================
# RUTAS
# ============================================================
:paths:
  :test:
    - +:test/
  :source:
    - ../Core/Src/
  :include:
    - ../Core/Inc/
  :support:
    - test/support/

:files:
  :source:
    - ../Core/Src/*.c
  :test:
    - test/test_*.c

:defines:
  :test:
    - UNITY_INCLUDE_DOUBLE

# === CMOCK HABILITADO ===
:cmock:
  :enabled: true

# === HABILITAR GENERACIÓN AUTOMÁTICA DE RUNNERS ===
:test_runner:
  :enabled: true


# ============================================================
# HERRAMIENTAS
# ============================================================
:tools:
  :test_compiler:
    :executable: arm-none-eabi-gcc
    :arguments:
      - -I"../Core/Inc"
      - -I"test/support/"
      - -I"vendor/bundle/ruby/3.0.0/gems/ceedling-*/vendor/unity/src"
      - -DUNITY_INCLUDE_DOUBLE
      - -fprofile-arcs
      - -ftest-coverage
      - -c "${1}"
      - -o "${2}"
  :test_linker:
    :executable: arm-none-eabi-gcc
    :arguments:
      - "${1}"
      - -o "${2}"
      - -lm
      - -lgcov
      - --specs=nano.specs